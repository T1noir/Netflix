<!doctype html><html><head><meta charset="utf-8">
    <title>My Favourite Movies</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet">
    <style>
        body { --primary: #6200ee; --secondary: #29b6f6; margin: 0px;}
        * {font-family: 'Roboto', sans-serif;}
        button { 
            -webkit-font-smoothing: antialiased;
            display: inline-block;
            text-decoration: none;
            margin: 2px;
            color: var(--primary);
            background: white;
            border: 1px solid var(--primary);
            height: 20px;
            font-size: 9px;
            text-transform: uppercase;
            cursor: pointer;
            transition: ease-in 0.2s all;
            padding: 0 8px 0 8px;
        }
        div#main {padding: 10px;}
        input {margin-bottom: 5px; margin-top: 2px; padding: 4px; font-size: 12px; }
        h1 {background: var(--primary); color: white; font-weight: 300; text-transform: uppercase; font-size: 20px; margin: 0px; padding: 15px;}
        h2 { margin-block-start: 0px; margin-block-end: 10px; font-size: 20px;  color: var(--primary);}
        button:hover { background: var(--primary); color: white; }
        div.actions { margin-top: 10px;}
        div.movie {display: inline-block; width: auto; padding: 10px; box-shadow: 2px 2px 7px #ccc; margin: 5px;}
        div.movie div.movie-img {width: 200px; height: auto; min-height: 200px; cursor: pointer;}
        div.movie div.movie-img img {width: 100%; height: auto;}
        div.movie div.title {text-align: center; overflow: hidden; text-overflow: ellipsis; width: 200px; white-space: nowrap; }
        div.field {color: var(--primary); text-transform: uppercase; font-size: 12px;}
    </style>

    <script type="text/javascript">

       // DATA MODEL

       let initial_movies = [
        { title: "Superlópez", director: "Javier Ruiz Caldera", thumbnail: "files/superlopez.png" },
        { title: "Jurassic Park", director: "Steven Spielberg", thumbnail: "files/jurassicpark.png" },
        { title: "Interstellar", director: "Christopher Nolan", thumbnail: "files/interstellar.png" }
    ];


        localStorage.my_movies = localStorage.my_movies || JSON.stringify(initial_movies);


        // VIEWS
        const indexView = (movies) => {
            let i=0;
            let view = "";

            while(i < movies.length) {
              view += `
                <div class="movie">
                   <div class="movie-img">
                        <img data-my-id="${i}" src="${movies[i].thumbnail}" onerror="this.src='files/noimage.png'"/>
                   </div>
                   <div class="title">
                       ${movies[i].title || "<em>No title</em>"}
                   </div>
                   <div class="actions">
                       <button class="show" data-my-id="${i}">View</button> <!-- Anañado botón Show -->
                       <button class="edit" data-my-id="${i}">edit</button>
                       <button class="delete" data-my-id="${i}">Delete</button> <!-- Añado botón Delete -->
                    </div>
                </div>\n`;
              i = i + 1;
            };

            view += `<div class="actions">
                        <button class="new">Add</button> <!-- Añado el botón Add (New) -->
                        <button class="reset">Reset</button> <!-- Añado el botón Reset -->
                        <button class="searchFrom">Search</button> <!-- EXTRA: Añado el botón Search -->
                    </div>`;

            return view;
        };


        const editView = (i, movie) => {
            return `<h2>Edit Movie </h2>
                <div class="field">
                Title <br>
                <input  type="text" id="title" placeholder="Title" 
                        value="${movie.title}">
                </div>
                <div class="field">
                Director <br>
                <input  type="text" id="director" placeholder="Director" 
                        value="${movie.director}">
                </div>
                <div class="field">
                Thumbnail <br>
                <input  type="text" id="thumbnail" placeholder="Thumbnail URL" 
                        value="${movie.thumbnail}">
                </div>
                <div class="actions">
                    <button class="update" data-my-id="${i}">
                        Update
                    </button>
                    <button class="index">
                        Back
                    </button>
               `;
        }


        const showView = (movie) => {
            return `
            <h2>${movie.title}</h2>
            <p>
                Director: ${movie.director}
            </p>
            <div class="actions">
                <button class="index">Back</button>
            </div>`;
        }


        const newView = () => {
            return `<h2>Create Movie</h2>
            <div class="field">
                Title <br>
                <input type="text" id="title" placeholder="Title">
            </div>
            <div class="field">
                Director <br>
                <input type="text" id="director" placeholder="Director">
            </div>
            <div class="field">
                Thumbnail <br>
                <input type="text" id="thumbnail" placeholder="Thumbnail URL">
            </div>
            <div class="actions">
                <button class="create">Create</button>
                <button class="index">Back</button>
            </div>`;
        }

        <!-- Extra: Añado searchView -->
        const searchView = () => {
            return `<h2>Search Movies</h2>
            <div class="field">
                Title <br>
                <input type="text" id="searchTitle" placeholder="Movie title"> <!-- Campo para introducir el título de la película -->
            </div>
            <div class="actions">
                <button class="search">Search</button> <!-- Botón para realizar la búsqueda -->
                <button class="index">Back</button> <!-- Botón para volver a la vista principal -->
            </div>`;
        };

        <!-- Extra: Añado resultsView -->
        const resultsView = (results) => {
            let i = 0;
            let view = "<h2>Search Results</h2>";
            
            <!-- Añado mensaje si no hay resultados -->
            if (results.length === 0) {
                view += "<p>No se encontraron películas</p>";
            }

            while (i < results.length) {
                let poster = results[i].poster_path
                ? "https://image.tmdb.org/t/p/w200" + results[i].poster_path
                : "files/noimage.png";
                view += `
                <div class="movie">
                    <img src="${poster}" onerror="this.src='files/noimage.png'"> <!-- Añado la imagen de la película -->
                    <h3>${results[i].title}</h3> <!-- Añado el título de la película -->
                    <p>Fecha de estreno: ${results[i].release_date}</p> <!-- Añado la fecha de estreno de la película -->
                    <p>${results[i].overview}</p>  <!-- Añado la sinopsis de la película -->
                    <div class="actions">
                        <button class="add-from-api" data-my-id="${i}">Add</button> <!-- Botón para añadir la película a la lista de favoritas -->
                    </div>
                </div>
                `;
                i = i + 1;
            }
            view += `<div class="actions">
                <button class="searchFrom">Back</button> <!-- Botón para volver a la vista de búsqueda -->
            </div>`;
            return view;
        };


        let searchResults = []; <!-- Extra: Variable para almacenar los resultados de búsqueda -->

        // CONTROLLERS 
        const indexContr = () => {
         let my_movies = JSON.parse(localStorage.my_movies);
         document.getElementById('main').innerHTML = indexView(my_movies);
         };


        const showContr = (i) => {
         let movie = JSON.parse(localStorage.my_movies)[i];
         document.getElementById('main').innerHTML = showView(movie);
        };

        const newContr = () => {
         document.getElementById('main').innerHTML = newView();
        };

        const createContr = () => {
         let my_movies = JSON.parse(localStorage.my_movies);
         let movie = {
            title: document.getElementById('title').value,
            director: document.getElementById('director').value,
            thumbnail: document.getElementById('thumbnail').value
        };
         my_movies.push(movie);
         localStorage.my_movies = JSON.stringify(my_movies);
         indexContr();
        };

        const editContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = editView(i, movie);
        };


        const updateContr = (i) => {
            let my_movies = JSON.parse(localStorage.my_movies);
            my_movies[i].title    = document.getElementById('title').value;
            my_movies[i].director  = document.getElementById('director').value;
            my_movies[i].thumbnail = document.getElementById('thumbnail').value;
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };


        const deleteContr = (i) => {
            if (confirm("Are you sure you want to delete this movie?")) {
                let my_movies = JSON.parse(localStorage.my_movies);
                my_movies.splice(i, 1);
                localStorage.my_movies = JSON.stringify(my_movies);
                indexContr();
            }
        };


        const resetContr = () => {
         localStorage.my_movies = JSON.stringify(initial_movies);
         indexContr();
        };


        <!-- EXTRA: Añado el controlador searchFormContr -->
        const searchFormContr = () => {
         document.getElementById('main').innerHTML = searchView(); <!-- Muestra la vista de búsqueda -->
        };


        <!-- EXTRA: Añado el controlador searchMovieContr -->
        const searchContr = (query) => {

            if (query.trim() === "") { <!-- Validación para evitar búsquedas vacías -->
                alert("Por favor, introduce el título de una película");
                return;
            }

            if (!/^[a-zA-Z0-9 ]+$/.test(query)) { <!-- Validación para evitar caracteres no válidos en el título de la película -->
                alert("Caracteres no válidos en el título de la película");
                return;
            }

            const options = { <!-- Configuración de la solicitud a la API de TMDb -->
                method: 'GET',
                headers: {
                    accept: 'application/json',
                    Authorization: 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI0Y2EyYmM0ZWU2NzNjOWJjMjdlZWNhODEwNDFjNzQ3ZCIsIm5iZiI6MTc5NDA0OTUyMi40OTYsInN1YiI6IjZhZWYwNWYyNjBmODQ4NDJmOGU3MmY1ZiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.efafZsCWVzRLu0XSyIG9NRREBrhNaPPI2wBprRm00Rg'
                }
            };

            fetch('https://api.themoviedb.org/3/search/movie?query=' + encodeURIComponent(query), options)

            .then(response => response.json())

            .then(response => {
                searchResults = response.results;
                document.getElementById('main').innerHTML = resultsView(searchResults);
            }) <!-- EXTRA: Añado el controlador searchMovieContr -->

            .catch(err => console.error(err));
        };


        <!-- EXTRA: Añado el controlador addMovieContr -->
        const addFromAPIContr = (movie) => {

            if (!movie || !movie.id || !movie.title || movie.title.trim() === "") {
                alert("Los datos de la película no son válidos");
                return;
            } 
            
            let i = searchResults.indexOf(movie);
            
            let my_movies = JSON.parse(localStorage.my_movies);

            let exists = my_movies.some(m => m.title === movie.title);

            if (exists) {
                alert("Esta película ya está en tu lista");
                return;
            }
            
            let poster = searchResults[i].poster_path
            ? "https://image.tmdb.org/t/p/w200" + searchResults[i].poster_path
            : "files/noimage.png";
            
            let newMovie = {
                title: searchResults[i].title,
                director: "Unknown",
                thumbnail: poster
            };
            
            const options = {
                method: 'GET',
                headers: {
                    accept: 'application/json',
                    Authorization: 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI0Y2EyYmM0ZWU2NzNjOWJjMjdlZWNhODEwNDFjNzQ3ZCIsIm5iZiI6MTc5NDA0OTUyMi40OTYsInN1YiI6IjZhZWYwNWYyNjBmODQ4NDJmOGU3MmY1ZiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.efafZsCWVzRLu0XSyIG9NRREBrhNaPPI2wBprRm00Rg'
                }
            };
            
            fetch('https://api.themoviedb.org/3/movie/' + searchResults[i].id + '/credits', options)

            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP error: " + response.status);
                }
                return response.json();
            })

            .then(response => {
                let director = response.crew.find(person => person.job === "Director");
                if (director) {
                    newMovie.director = director.name;
                }
                my_movies.push(newMovie);
                localStorage.my_movies = JSON.stringify(my_movies);
                alert("Película añadida con éxito");
                indexContr();
            })

            .catch(err => {
                console.error(err);
                alert("Error al conectar con TMDb");
            });
        };


        // EVENT ROUTER
        const matchEvent = (ev, sel) => ev.target.matches(sel);
        const myId = (ev) => Number(ev.target.dataset.myId);

        document.addEventListener('click', ev => {
            if      (matchEvent(ev, '.index'))  indexContr  ();
            else if (matchEvent(ev, '.edit'))   editContr   (myId(ev));
            else if (matchEvent(ev, '.update')) updateContr (myId(ev));
            else if (matchEvent(ev, '.show')) showContr(myId(ev));
            else if (matchEvent(ev, '.new')) newContr();
            else if (matchEvent(ev, '.create')) createContr ();
            else if (matchEvent(ev, '.delete')) deleteContr(myId(ev));
            else if (matchEvent(ev, '.reset')) resetContr();
            else if (matchEvent(ev, '.searchFrom')) searchFormContr(); <!-- EXTRA: Añado el botón Search -->
            else if (matchEvent(ev, '.search')) searchContr(document.getElementById('searchTitle').value); <!-- EXTRA: Añado el botón SearchMovie -->
            else if (matchEvent(ev, '.add-from-api')) {
                ev.target.disabled = true;
                addFromAPIContr(searchResults[myId(ev)]);
            } <!-- EXTRA: Añado el botón add-from-api -->
        })

        
        
        // Initialization        
        document.addEventListener('DOMContentLoaded', indexContr);

        <!-- EXTRA: Añado el evento keydown para que al pulsar Enter se realice la búsqueda -->
        document.addEventListener('keydown', ev => {
            if (ev.key === 'Enter' && matchEvent(ev, '#searchTitle')) {
                searchContr(document.getElementById('searchTitle').value);
            }
        });
    </script>
</head>

<body>

    <h1>My Favourite Movies</h1>
    <div id="main"> <!-- The view is included here --> </div>

    
</body>
</html>
